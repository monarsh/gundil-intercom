name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty for a normal build.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: (cd packages/intercom_core && dart pub get)
      - run: (cd packages/intercom_audio && flutter pub get)
      - run: flutter analyze
      - run: flutter test
      - run: (cd packages/intercom_core && dart test)

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release -czf gundil-intercom-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-linux-x64
          path: gundil-intercom-linux-x64.tar.gz
      - run: tool/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-appimage-x86_64
          path: build/GundilIntercom-*-x86_64.AppImage

  linux-arm64:
    # Desktop app for Raspberry Pi 4/5 (and other boards) with a 64-bit OS.
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Install Flutter (git checkout; there is no arm64 archive)
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter build linux --release
      - run: tar -C build/linux/arm64/release -czf gundil-intercom-linux-arm64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-linux-arm64
          path: gundil-intercom-linux-arm64.tar.gz
      - run: tool/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-appimage-aarch64
          path: build/GundilIntercom-*-aarch64.AppImage

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: flutter build windows --release
      - name: Bundle Visual C++ runtime (app-local)
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $dst
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$ver" installer\windows\gundil_intercom.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-windows-setup
          path: build/installer/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-windows-x64-portable
          path: build/windows/x64/runner/Release/

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      # One fixed signing key from repository secrets: Android refuses to
      # install an update signed with a different key than the app on the
      # phone. A release must never go out with a throw-away key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$RELEASE" ]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Releases need the fixed Android signing key (see docs/android-signing.md), or phones can't install the update."
              exit 1
            fi
            echo "::warning::No Android signing key: APKs are signed with a throw-away debug key (fine for testing only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-gundil}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release   # universal APK (all CPUs)
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-android
          path: build/app/outputs/flutter-apk/*.apk

  node:
    # Headless node for Orange Pi / Raspberry Pi (32-bit and 64-bit ARM).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: pip install ziglang
      - run: tool/build_node.sh arm
      - run: tool/build_node.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-node-linux-arm
          path: build/node/gundil-intercom-node-linux-arm.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-node-linux-arm64
          path: build/node/gundil-intercom-node-linux-arm64.tar.gz

  ios:
    # iPhone / iPad. Unsigned: installed with AltStore or Sideloadly, which
    # sign it with the user's own Apple ID (see .github/release/notes.md).
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # The native audio library must be inside, with its entry points.
          LIB=build/ios/iphoneos/Runner.app/Frameworks/intercom_audio.framework/intercom_audio
          nm -gU "$LIB" > "$RUNNER_TEMP/syms.txt"
          grep _ia_init "$RUNNER_TEMP/syms.txt"
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry gundil-intercom-ios-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-ios
          path: build/ipa/gundil-intercom-ios-unsigned.ipa

  macos:
    # Mac (Apple silicon and Intel). Signed ad hoc only (no Apple Developer
    # ID): opened the first time with right-click -> Open.
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the tested toolchain (3.50 deprecates flutter/material).
          flutter-version: 3.47.9
          cache: true
      - run: flutter build macos --release
      - name: Package app
        run: |
          set -euo pipefail
          cd build/macos/Build/Products/Release
          # The native audio library must be inside, with its entry points.
          nm -gU "Gundil Intercom.app/Contents/Frameworks/intercom_audio.framework/intercom_audio" > "$RUNNER_TEMP/syms.txt"
          grep _ia_init "$RUNNER_TEMP/syms.txt"
          ditto -c -k --sequesterRsrc --keepParent "Gundil Intercom.app" \
            "$GITHUB_WORKSPACE/gundil-intercom-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gundil-intercom-macos
          path: gundil-intercom-macos.zip

  release:
    # Publishes a GitHub Release with every build, either when a v* tag is
    # pushed (git tag v1.0.0 && git push origin v1.0.0) or when the workflow
    # is run by hand with the "release" input (the tag is then created on
    # the built commit).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [linux, linux-arm64, windows, android, node, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and name release files
        run: |
          set -euo pipefail
          TAG="${{ inputs.release || github.ref_name }}"
          V="${TAG#v}"
          mkdir -p dist
          A=artifacts
          cp "$A"/gundil-intercom-windows-setup/*.exe "dist/GundilIntercom-$V-windows-x64-setup.exe"
          (cd "$A/gundil-intercom-windows-x64-portable" && zip -qr "$GITHUB_WORKSPACE/dist/GundilIntercom-$V-windows-x64-portable.zip" .)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$A/gundil-intercom-android/app-$abi-release.apk" "dist/GundilIntercom-$V-android-$abi.apk"
          done
          cp "$A/gundil-intercom-android/app-release.apk" "dist/GundilIntercom-$V-android-universal.apk"
          cp "$A"/gundil-intercom-appimage-x86_64/*.AppImage "dist/GundilIntercom-$V-x86_64.AppImage"
          cp "$A"/gundil-intercom-appimage-aarch64/*.AppImage "dist/GundilIntercom-$V-aarch64.AppImage"
          cp "$A/gundil-intercom-linux-x64/gundil-intercom-linux-x64.tar.gz" "dist/GundilIntercom-$V-linux-x64.tar.gz"
          cp "$A/gundil-intercom-linux-arm64/gundil-intercom-linux-arm64.tar.gz" "dist/GundilIntercom-$V-linux-arm64.tar.gz"
          cp "$A/gundil-intercom-node-linux-arm/gundil-intercom-node-linux-arm.tar.gz" "dist/gundil-intercom-node-$V-linux-arm.tar.gz"
          cp "$A/gundil-intercom-node-linux-arm64/gundil-intercom-node-linux-arm64.tar.gz" "dist/gundil-intercom-node-$V-linux-arm64.tar.gz"
          cp "$A/gundil-intercom-ios/gundil-intercom-ios-unsigned.ipa" "dist/GundilIntercom-$V-ios-unsigned.ipa"
          cp "$A/gundil-intercom-macos/gundil-intercom-macos.zip" "dist/GundilIntercom-$V-macos.zip"
          chmod +x dist/*.AppImage
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # "What's new" for this tag (optional), then the general notes.
          : > release-notes.md
          if [ -f ".github/release/changelog/$TAG.md" ]; then
            cat ".github/release/changelog/$TAG.md" >> release-notes.md
            echo >> release-notes.md   # Keep it a separate paragraph.
          fi
          sed "s/VERSION/$V/g" .github/release/notes.md >> release-notes.md
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Gundil Intercom ${{ inputs.release || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
