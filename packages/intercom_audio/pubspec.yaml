name: intercom_audio
description: "Low-latency 16-bit mono PCM capture/playback over FFI (miniaudio) for Linux, Windows and Android."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
