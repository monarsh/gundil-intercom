name: intercom_core
description: >-
  Platform-independent engine of Gundil Intercom: LAN discovery, TCP
  protocol, push-to-talk logic, saved peers, FFI audio bindings, and the
  headless node (bin/gundil_node.dart) for boards such as the Orange Pi PC.
version: 1.5.4
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  ffi: ^2.1.3
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  gundil-intercom-node: gundil_node
