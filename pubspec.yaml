name: p2p_intercom
description: "Gundil Intercom: peer-to-peer LAN push-to-talk intercom over TCP/IP for Linux, Windows and Android."
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  intercom_audio:
    path: packages/intercom_audio
  intercom_core:
    path: packages/intercom_core
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
